<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pen</title>
  </head>
  <body>
        <main class="app">
          <h1>My First App</h1>
    
          <p>Enter your name and role, then click the button.</p>
    
          <input id="nameInput" type="text" placeholder="Your name" />
          <input id="roleInput" type="text" placeholder="Your role" />
    
          <button id="greetButton">
                Generate message
          </button>

          <button id="clearButton" class="secondaryButton">
                Clear saved data
          </button>
    
          <p id="result"></p>

          <section class="history">
            <h2>Recent messages</h2>
            <ul id="messageList"></ul>
          </section>
          
        </main>
        <script src="./script.js"></script>
  </body>
</html>
